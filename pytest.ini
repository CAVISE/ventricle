[pytest]
# Add the project root to the import path so tests can import testing helpers.
pythonpath = .

# Let pytest-asyncio handle async tests and fixtures without explicit markers.
asyncio_mode = auto

# Give async fixtures a function-scoped event loop by default.
asyncio_default_fixture_loop_scope = function

# Give each async test its own event loop by default.
asyncio_default_test_loop_scope = function

# Fail on configuration warnings and unregistered test markers.
addopts = --strict-config --strict-markers
