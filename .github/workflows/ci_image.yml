name: CI Image

on:
  pull_request:
    paths:
      - .github/containers/ci/**
      - .github/workflows/ci_image.yml
  push:
    branches:
      - trunk
    paths:
      - .github/containers/ci/**
      - .github/workflows/ci_image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: ghcr.io/cavise/ventricle-ci

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish CI image
        uses: docker/build-push-action@v7
        with:
          context: .github/containers/ci
          file: .github/containers/ci/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.CI_IMAGE }}:v1.0
            ${{ env.CI_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
